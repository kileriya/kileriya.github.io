<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тест по C#</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9;
      color: #1e293b;
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app {
      width: 100%;
      max-width: 700px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 24px 20px;
      margin-top: 20px;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; color: #0f172a; }
    .subtitle { color: #64748b; font-size: 0.95rem; margin-bottom: 24px; }
    .status {
      padding: 12px 16px;
      border-radius: 12px;
      background: #eef2ff;
      color: #3730a3;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .status.error { background: #fef2f2; color: #b91c1c; }
    .question-card {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #e2e8f0;
    }
    .question-card:last-child { border-bottom: none; margin-bottom: 0; }
    .q-text { font-weight: 600; font-size: 1.05rem; margin-bottom: 14px; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.15s;
      font-size: 0.98rem;
    }
    .option:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .option.selected { border-color: #3b82f6; background: #eff6ff; }
    .option input[type="radio"] {
      width: 18px; height: 18px; accent-color: #3b82f6; flex-shrink: 0;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      margin-top: 8px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 20px;
      background: #f0fdf4;
      border-radius: 16px;
      text-align: center;
      display: none;
    }
    .result.show { display: block; }
    .score-big { font-size: 2.5rem; font-weight: 700; color: #15803d; }
    .feedback-item { margin-top: 16px; text-align: left; font-size: 0.92rem; }
    .correct { color: #15803d; font-weight: 600; }
    .wrong { color: #b91c1c; font-weight: 600; }
    @media (max-width: 480px) {
      .app { padding: 16px; border-radius: 16px; }
      h1 { font-size: 1.35rem; }
      .option { padding: 10px 12px; font-size: 0.92rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>Тест по C#</h1>
  <p class="subtitle">Проверь свои знания основ языка</p>
  <div id="status" class="status">Загрузка вопросов из Google Таблиц…</div>
  <div id="questions"></div>
  <button id="submitBtn" disabled>Проверить ответы</button>
  <div id="result" class="result"></div>
</div>

<script>
  // ===== ЗАМЕНИ ЭТО =====
  const SPREADSHEET_ID = '1-H22yc0493qH1uI7iZM6Er_dweMF-Q9Wr0ra8BOsgFM';
  // ======================

  const statusEl = document.getElementById('status');
  const questionsEl = document.getElementById('questions');
  const submitBtn = document.getElementById('submitBtn');
  const resultEl = document.getElementById('result');

  let quizData = [];

  // Официальный gviz endpoint — работает с публичными таблицами без OAuth
  const url = 'quiz.json';

  fetch(url)
    .then(res => {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(text => {
      // gviz оборачивает JSON в /*O_o*/ ... ; убираем обёртку
      const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
      const data = JSON.parse(jsonString);
      if (!data.table || !data.table.rows) throw new Error('Нет данных в таблице');
      
      quizData = data.table.rows
        .filter(row => row.c && row.c[0] && row.c[0].v)
        .map(row => {
          const c = row.c;
          return {
            question: c[0].v,
            options: [c[1].v, c[2].v, c[3].v],
            correct: parseInt(c[4].v, 10) // 0, 1 или 2
          };
        });

      if (quizData.length === 0) throw new Error('Вопросы не найдены. Проверь колонки A-E.');
      
      statusEl.textContent = `Загружено вопросов: ${quizData.length}`;
      renderQuestions();
      submitBtn.disabled = false;
    })
    .catch(err => {
      statusEl.className = 'status error';
      statusEl.textContent = 'Ошибка загрузки: ' + err.message + '. Проверь ID таблицы, доступ «Читатель» и колонки A-E.';
      console.error(err);
    });

  function renderQuestions() {
    questionsEl.innerHTML = quizData.map((q, i) => `
      <div class="question-card" data-index="${i}">
        <div class="q-text">${i + 1}. ${escapeHtml(q.question)}</div>
        <div class="options">
          ${q.options.map((opt, j) => `
            <label class="option">
              <input type="radio" name="q${i}" value="${j}">
              <span>${escapeHtml(opt)}</span>
            </label>
          `).join('')}
        </div>
      </div>
    `).join('');

    // Подсветка выбранного
    document.querySelectorAll('.option input').forEach(input => {
      input.addEventListener('change', () => {
        const parent = input.closest('.question-card');
        parent.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
        input.closest('.option').classList.add('selected');
      });
    });
  }

  submitBtn.addEventListener('click', () => {
    let correctCount = 0;
    const details = [];

    quizData.forEach((q, i) => {
      const selected = document.querySelector(`input[name="q${i}"]:checked`);
      const userAnswer = selected ? parseInt(selected.value, 10) : -1;
      const isCorrect = userAnswer === q.correct;
      if (isCorrect) correctCount++;
      details.push({
        question: q.question,
        userAnswer: userAnswer >= 0 ? q.options[userAnswer] : '—',
        correctAnswer: q.options[q.correct],
        isCorrect
      });
    });

    const score = Math.round((correctCount / quizData.length) * 100);

    resultEl.className = 'result show';
    resultEl.innerHTML = `
      <div class="score-big">${score}%</div>
      <p>Правильно ${correctCount} из ${quizData.length}</p>
      <div class="feedback-item">
        ${details.map((d, i) => `
          <div style="margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid #dcfce7;">
            <strong>${i + 1}. ${escapeHtml(d.question)}</strong><br>
            Твой ответ: <span class="${d.isCorrect ? 'correct' : 'wrong'}">${escapeHtml(d.userAnswer)}</span><br>
            ${!d.isCorrect ? `Правильно: <span class="correct">${escapeHtml(d.correctAnswer)}</span>` : '✓ Верно'}
          </div>
        `).join('')}
      </div>
    `;
    resultEl.scrollIntoView({ behavior: 'smooth' });
  });

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }
</script>
</body>
</html>
